name: validate-catalog

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate-catalog full
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o social-gopher ./cmd/social-gopher

      - name: Validate seed catalog
        run: ./social-gopher -validate-catalog -profile full -timeout 30s -workers 10
